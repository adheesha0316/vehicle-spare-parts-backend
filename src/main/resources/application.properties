spring.datasource.url=jdbc:mysql://localhost:3306/vehicleSpare?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=acpt
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Hibernate will automatically detect the best dialect for MySQL 8+
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# =============================================================
# LOGGING CONFIGURATION (For GlobalExceptionHandler)
# =============================================================
# Saves logs to a file in the project directory
logging.file.name=logs/vehicle-spare-backend.log
logging.level.root=INFO
logging.level.com.spareparts.spareparts_backend=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Log Rotation: Keeps logs from getting too large
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

